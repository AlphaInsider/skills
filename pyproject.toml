[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphainsider-skills"
version = "1.0.4"
description = "Development tooling for AlphaInsider skills"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: opt-in read-only network smoke tests",
]
