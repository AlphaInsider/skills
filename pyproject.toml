[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphainsider-skills"
version = "1.0.0"
description = "Development tooling for AlphaInsider skills"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: opt-in read-only network smoke tests",
]
