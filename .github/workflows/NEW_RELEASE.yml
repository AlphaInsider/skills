name: NEW_RELEASE

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version Number (eg: 0.0.0)'

permissions:
  contents: write

concurrency:
  group: skills-release
  cancel-in-progress: false

jobs:
  # update version
  update_version:
    uses: ./.github/workflows/_update_version.yml
    with:
      version: ${{ inputs.version }}

  # create new release
  create_new_release:
    needs: update_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.update_version.outputs.commit_sha }}

      - name: Package skill ZIPs
        shell: bash
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          mkdir release-assets
          cat > release-notes.md <<'EOF'
          ## Skill downloads

          Download one skill ZIP below for each skill you want to install in your agent harness.
          Upload the ZIP directly through its skill upload/import feature, then enable the skill.
          No extraction or recompression is needed: each ZIP contains the skill folder with
          its SKILL.md, references, and scripts. GitHub's Source code archives contain the
          whole repository and are not individual skill uploads.

          See the [installation guide](https://github.com/AlphaInsider/skills#web-clients).
          The [AlphaInsider API skill](https://api.alphainsider.com/skill.md) is hosted separately.

          EOF
          for entrypoint in skills/*/SKILL.md; do
            skill=$(basename "$(dirname "$entrypoint")")
            git archive --format=zip --output="release-assets/$skill.zip" HEAD:skills "$skill"
            printf -- '- [%s.zip](https://github.com/%s/releases/download/v%s/%s.zip)\n' \
              "$skill" "$GITHUB_REPOSITORY" "$NEW_VERSION" "$skill" >> release-notes.md
          done

      - name: Create new release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.update_version.outputs.commit_sha }}
        run: |
          TAG_REFS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$NEW_VERSION" --jq '.[].ref')
          if grep -Fxq "refs/tags/v$NEW_VERSION" <<< "$TAG_REFS"; then
            echo "Error: Tag v$NEW_VERSION already exists."
            exit 1
          fi
          gh release create "v$NEW_VERSION" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Release v$NEW_VERSION" \
            --notes-file release-notes.md \
            --generate-notes \
            --latest
