name: NEW_RELEASE

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version Number (eg: 0.0.0)'

permissions:
  contents: write

concurrency:
  group: skills-release
  cancel-in-progress: false

jobs:
  # update version
  update_version:
    uses: ./.github/workflows/_update_version.yml
    with:
      version: ${{ inputs.version }}

  # create new release
  create_new_release:
    needs: update_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.update_version.outputs.commit_sha }}

      - name: Package skill ZIPs
        shell: bash
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          mkdir release-assets
          cat > release-notes.md <<'EOF'
          ## Install or update skills

          Choose a skill below. Download its ZIP for a web upload, or copy its prompt into your agent.

          Upload the ZIP through your website's skill manager, enable the skill, and start a new
          conversation. To update an uploaded skill, replace the installed copy with this version's
          ZIP. Each archive includes the skill folder with its SKILL.md, references, and scripts.
          No extraction or recompression is needed. GitHub's Source code archives contain the whole
          repository; use the individual skill ZIPs below for uploads.

          Your agent needs a skill manager or skills directory to install or update a skill.
          Choose this project or a global installation when prompted.

          The [AlphaInsider API skill](https://api.alphainsider.com/skill.md) is hosted separately
          and is not part of this versioned release.

          EOF
          printf 'For setup details, see the [installation guide](https://github.com/%s/blob/v%s/README.md#install).\n\n' \
            "$GITHUB_REPOSITORY" "$NEW_VERSION" >> release-notes.md
          for entrypoint in skills/*/SKILL.md; do
            skill=$(basename "$(dirname "$entrypoint")")
            git archive --format=zip --output="release-assets/$skill.zip" HEAD:skills "$skill"
            download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$NEW_VERSION/$skill.zip"
            printf '### %s\n\n[%s.zip](%s)\n\n' "$skill" "$skill" "$download_url"
            printf 'Install with your agent:\n\n```text\nInstall the %s skill version %s from %s for use in future conversations. Confirm where it was installed and whether it is ready to use.\n```\n\n' \
              "$skill" "$NEW_VERSION" "$download_url"
            printf 'Update an installed copy:\n\n```text\nUpdate my installed %s skill to version %s from %s. Preserve its current installation scope and report what changed.\n```\n\n' \
              "$skill" "$NEW_VERSION" "$download_url"
          done >> release-notes.md

      - name: Create new release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.update_version.outputs.commit_sha }}
        run: |
          TAG_REFS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$NEW_VERSION" --jq '.[].ref')
          if grep -Fxq "refs/tags/v$NEW_VERSION" <<< "$TAG_REFS"; then
            echo "Error: Tag v$NEW_VERSION already exists."
            exit 1
          fi
          gh release create "v$NEW_VERSION" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Release v$NEW_VERSION" \
            --notes-file release-notes.md \
            --generate-notes \
            --latest
